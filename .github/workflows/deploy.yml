# ═══════════════════════════════════════════════════════════════════════════
# ForgeLM — GitHub Actions Deployment
# ═══════════════════════════════════════════════════════════════════════════
#
# Automatically deploys ForgeLM to Cloudflare Workers on every push to main.
#
# Required secrets (set in GitHub repo settings):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers permissions
#   OLLAMA_HOST           — Your tunnel URL (e.g., https://ollama.your-domain.com)
#
# Get a Cloudflare API token at:
#   https://dash.cloudflare.com/profile/api-tokens
# (Permission: Workers > Edit)

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ForgeLM to Cloudflare Workers

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🚀 Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            OLLAMA_HOST
        env:
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
