<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForgeLM — AI Code Assistant</title>
  <meta name="description" content="ForgeLM: Your AI-powered coding companion. Chat with language models and craft code together." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236363f1'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='20' fill='white' font-family='sans-serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body>
  <!-- ─── Mobile Menu Overlay ─────────────────────────────────── -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- ─── Mobile Menu Button ──────────────────────────────────── -->
  <button id="mobileMenuBtn" class="mobile-menu-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- ─── App Shell ────────────────────────────────────────────── -->
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⚒️</span>
          <span class="logo-text">ForgeLM</span>
        </div>
        <button id="newChatBtn" class="btn btn-new-chat" title="New conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Chat
        </button>
      </div>

      <div id="conversationList" class="conversation-list">
        <!-- Conversations populated by JS -->
      </div>

      <div class="sidebar-footer">
        <div class="model-selector">
          <label for="modelSelect" class="model-label">Model</label>
          <div class="select-wrapper">
            <select id="modelSelect" disabled>
              <option value="">Loading models...</option>
            </select>
            <svg class="select-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
        <div class="theme-toggle-wrapper">
          <button id="themeToggle" class="btn btn-icon" title="Toggle theme">
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main id="main" class="main">
      <!-- Chat Messages -->
      <div id="chatContainer" class="chat-container">
        <div id="messages" class="messages">
          <!-- Welcome message -->
          <div class="welcome">
            <div class="welcome-icon">⚒️</div>
            <h1 class="welcome-title">Welcome to ForgeLM</h1>
            <p class="welcome-subtitle">Your AI-powered coding companion</p>
            <div class="welcome-suggestions">
              <button class="suggestion-chip" data-prompt="Write a Python function to merge two sorted arrays">
                Write a Python function to merge two sorted arrays
              </button>
              <button class="suggestion-chip" data-prompt="Explain how React useEffect works with examples">
                Explain how React useEffect works
              </button>
              <button class="suggestion-chip" data-prompt="Create a Dockerfile for a Node.js app">
                Create a Dockerfile for Node.js
              </button>
              <button class="suggestion-chip" data-prompt="Write a SQL query to find duplicate emails">
                SQL: Find duplicate emails
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Ask me anything about code..."
            rows="1"
            autofocus
          ></textarea>
          <button id="sendBtn" class="btn btn-send" disabled title="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
          <button id="stopBtn" class="btn btn-stop hidden" title="Stop generating">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="4" width="16" height="16" rx="2"/>
            </svg>
          </button>
        </div>
        <p class="input-footer">
          ForgeLM may produce inaccurate information. Verify critical code.
        </p>
      </div>
    </main>
  </div>

  <!-- ─── Toast Container ──────────────────────────────────────── -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
