<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0b"/>
<title>ForgeLLM Chat — free AI coding assistant</title>
<meta name="description" content="Free AI chat using your own Ollama models. No login needed."/>
<link rel="icon" type="image/png" href="/logo-icon.png"/>
<link rel="apple-touch-icon" href="/logo-icon.png"/>
<link rel="stylesheet" href="/styles.css"/>
<style>
.chat-app { height: 100dvh; display: flex; flex-direction: column; background: #0a0a0b; }
.chat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); background: #0c0c0f; flex-shrink: 0; }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; }
.chat-input-area { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
.model-status { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
.model-status-dot { width: 8px; height: 8px; border-radius: 50%; }
.model-status-dot.connected { background: #54a967; box-shadow: 0 0 6px rgba(84,169,103,0.7); }
.model-status-dot.connecting { background: #eab308; }
.model-status-dot.disconnected { background: #ef4444; }
.msg { max-width: 85%; margin-bottom: 14px; padding: 12px 14px; border-radius: 16px; font-size: 13px; line-height: 1.6; }
.msg.user { margin-left: auto; background: rgba(99,99,241,0.10); color: rgba(255,255,255,0.90); border-bottom-right-radius: 4px; }
.msg.assistant { margin-right: auto; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); border-bottom-left-radius: 4px; }
.msg-header { font-size: 11px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.msg-header .name { color: rgba(84,169,103,0.90); }
.msg-header .sep { color: rgba(255,255,255,0.30); }
.msg-header .model { color: rgba(255,255,255,0.40); }
.chat-input-wrapper { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; background: rgba(255,255,255,0.03); }
.chat-input-wrapper textarea { flex: 1; background: transparent; border: none; outline: none; color: rgba(255,255,255,0.90); font-size: 13px; font-family: inherit; resize: none; min-height: 24px; max-height: 180px; line-height: 1.5; }
.chat-input-wrapper textarea::placeholder { color: rgba(255,255,255,0.35); }
.send-btn, .stop-btn { width: 32px; height: 32px; border-radius: 8px; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; flex-shrink: 0; }
.send-btn { background: #6363f1; }
.send-btn:disabled { opacity: 0.3; cursor: default; }
.send-btn:hover:not(:disabled) { opacity: 0.85; }
.stop-btn { background: #ef4444; display: none; }
.model-select { background: #0a0a0b; color: #ffffff; border: 1px solid rgba(255,255,255,0.20); border-radius: 6px; padding: 5px 10px; font-size: 12px; outline: none; cursor: pointer; min-width: 180px; }
.model-select:hover { border-color: rgba(255,255,255,0.35); }
.model-select option { background: #0a0a0b; color: #ffffff; padding: 4px; }
.model-select:focus { border-color: rgba(255,255,255,0.40); box-shadow: 0 0 0 2px rgba(255,255,255,0.08); }
.selected-model-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255,255,255,0.55); }
.selected-model-dot { width: 7px; height: 7px; border-radius: 50%; }
.selected-model-dot.online { background: #54a967; box-shadow: 0 0 6px rgba(84,169,103,0.7); }
.selected-model-dot.loading { background: #eab308; }
.selected-model-dot.offline { background: #ef4444; }
.thinking { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.45); }
.thinking-dot { width: 6px; height: 6px; border-radius: 50%; background: #54a967; animation: thinking-pulse 1.2s infinite; }
.thinking-dot:nth-child(2) { animation-delay: 0.2s; }
.thinking-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes thinking-pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
.starter { cursor: pointer; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); padding: 12px 16px; border-radius: 12px; margin-top: 10px; max-width: 400px; transition: background 0.2s; }
.starter:hover { background: rgba(255,255,255,0.06); }
@media (max-width: 640px) { .msg { max-width: 95%; } .model-select { min-width: 120px; max-width: 140px; } }
</style>
</head>
<body>
<div id="chat-app" class="chat-app">
  <!-- Header -->
  <div class="chat-header">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 text-white/70 hover:text-white transition-colors">
        <img src="/logo-icon.png" alt="ForgeLLM" class="h-7 w-7 rounded-[5px]" loading="eager"/>
        <span class="text-[13px] font-medium">forgellm</span>
      </a>
      <span class="text-white/15">/</span>
      <span class="text-[13px] text-white/55">Chat</span>
    </div>
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="model-status hidden sm:flex">
        <span id="chat-model-dot" class="model-status-dot connecting"></span>
        <span id="chat-model-text" class="text-white/55">Connecting...</span>
      </div>
      <select id="chat-model-select" class="model-select">
        <option value="">Loading models...</option>
      </select>
      <span id="selected-model-status" class="selected-model-status hidden">
        <span id="selected-model-dot" class="selected-model-dot loading"></span>
        <span id="selected-model-text">Loading...</span>
      </span>
      <button id="new-chat-btn" class="text-white/40 hover:text-white transition-colors text-[12px] px-2 py-1 rounded-md hover:bg-white/5" title="New chat">+ New</button>
    </div>
  </div>

  <!-- Messages -->
  <div id="chat-messages" class="chat-messages">
    <div id="welcome" class="welcome">
      <img src="/logo-icon.png" alt="ForgeLLM" class="h-12 w-12 rounded-[8px] mb-4 opacity-80"/>
      <h1 class="text-xl text-white/90">What can I help you build?</h1>
      <p class="text-sm text-white/40 mt-2 mb-6">Powered by your own Ollama models.</p>
      <div class="starter" data-starter="Explain the ForgeLLM architecture"><p class="text-white/70 text-sm">Explain the ForgeLLM architecture</p></div>
      <div class="starter" data-starter="Write a React todo app"><p class="text-white/70 text-sm">Write a React todo app</p></div>
      <div class="starter" data-starter="Debug my Python script"><p class="text-white/70 text-sm">Debug my Python script</p></div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <div class="chat-input-wrapper">
      <textarea id="chat-input" placeholder="Ask anything..." rows="1"></textarea>
      <button id="send-btn" class="send-btn" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </button>
      <button id="stop-btn" class="stop-btn" title="Stop generating">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect width="14" height="14" x="5" y="5" rx="2" ry="2"/></svg>
      </button>
    </div>
    <div class="flex items-center justify-between mt-2 px-1">
      <span class="text-[11px] text-white/20">Ctrl+Enter to send · Esc to stop</span>
      <span id="chat-status-info" class="text-[11px] text-white/20"></span>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const dom = {
    messages: document.getElementById('chat-messages'),
    input: document.getElementById('chat-input'),
    sendBtn: document.getElementById('send-btn'),
    stopBtn: document.getElementById('stop-btn'),
    modelSelect: document.getElementById('chat-model-select'),
    newChatBtn: document.getElementById('new-chat-btn'),
    modelDot: document.getElementById('chat-model-dot'),
    modelText: document.getElementById('chat-model-text'),
    statusInfo: document.getElementById('chat-status-info'),
    welcome: document.getElementById('welcome'),
  };

  const state = {
    streaming: false,
    abortController: null,
    models: [],
    connected: false,
  };

  const DEFAULT_MODEL = 'nemotron-3-super:latest';

  function setModelStatus(status, text) {
    dom.modelDot.className = 'model-status-dot ' + status;
    dom.modelText.textContent = text || status;
    if (dom.statusInfo) dom.statusInfo.textContent = text || '';
  }

  function updateSelectedModelStatus() {
    const selected = dom.modelSelect.value;
    const dot = document.getElementById('selected-model-dot');
    const text = document.getElementById('selected-model-text');
    const wrap = document.getElementById('selected-model-status');
    if (!wrap || !dot || !text) return;
    if (!selected) {
      wrap.classList.add('hidden');
      return;
    }
    wrap.classList.remove('hidden');
    if (!state.connected) {
      dot.className = 'selected-model-dot offline';
      text.textContent = 'Offline';
      return;
    }
    const loaded = state.models.some(m => m.name === selected);
    if (loaded) {
      dot.className = 'selected-model-dot online';
      text.textContent = 'Online';
    } else {
      dot.className = 'selected-model-dot loading';
      text.textContent = 'Loading...';
    }
  }

  function abortableFetch(url, options, timeoutMs) {
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
      try { return fetch(url, { ...options, signal: AbortSignal.timeout(timeoutMs) }); } catch (e) {}
    }
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(t));
  }

  async function loadModels() {
    try {
      setModelStatus('connecting', 'Connecting to Ollama...');
      const res = await abortableFetch('/api/tags', {}, 8000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      state.models = data.models || [];
      state.connected = true;

      dom.modelSelect.innerHTML = state.models.map(m =>
        '<option value="' + m.name + '">' + m.name + '</option>'
      ).join('');

      const preferred = state.models.find(m => m.name === DEFAULT_MODEL) ||
                        state.models.find(m => m.name.includes('nemotron')) ||
                        state.models[0];
      dom.modelSelect.value = preferred ? preferred.name : '';

      setModelStatus('connected', state.models.length + ' models available');
      updateSelectedModelStatus();
    } catch (e) {
      state.connected = false;
      setModelStatus('disconnected', 'Ollama offline');
      dom.modelSelect.innerHTML = '<option value="">No models</option>';
      updateSelectedModelStatus();
    }
  }

  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function formatMessage(text) {
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
      return '<div class="mt-2 rounded-lg border border-white/10 bg-black/40 p-3 font-mono text-[12px] text-white/60"><div class="text-[11px] text-white/30 mb-1">' + escapeHtml(lang || 'code') + '</div><pre>' + escapeHtml(code.trim()) + '</pre></div>';
    });
    text = text.replace(/`([^`]+)`/g, '<code class="bg-white/10 rounded px-1 text-[12px] font-mono">$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\n/g, '<br/>');
    return text;
  }

  function addMessage(content, role, modelName) {
    if (dom.welcome) { dom.welcome.remove(); dom.welcome = null; }

    var msg = document.createElement('div');
    msg.className = 'msg ' + role;

    if (role === 'assistant' && modelName) {
      var hdr = document.createElement('div');
      hdr.className = 'msg-header';
      hdr.innerHTML = '<span class="name">ForgeLLM</span><span class="sep">·</span><span class="model">' + escapeHtml(modelName) + '</span>';
      msg.appendChild(hdr);
    }

    var contentDiv = document.createElement('div');
    if (role === 'user') {
      contentDiv.textContent = content;
    } else {
      contentDiv.innerHTML = formatMessage(content);
    }
    msg.appendChild(contentDiv);
    dom.messages.appendChild(msg);
    dom.messages.scrollTop = dom.messages.scrollHeight;
    return { msg, contentDiv };
  }

  function setThinking(el, model) {
    el.innerHTML = '<span class="thinking"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span><span>Thinking with ' + escapeHtml(model) + '...</span></span>';
  }

  function showStreamingUI(show) {
    dom.sendBtn.style.display = show ? 'none' : 'flex';
    dom.stopBtn.style.display = show ? 'flex' : 'none';
  }

  async function sendMessage() {
    if (!dom.input || state.streaming) return;
    var text = dom.input.value.trim();
    if (!text) return;

    dom.input.value = '';
    dom.input.style.height = 'auto';
    handleInput();

    addMessage(text, 'user');

    var model = dom.modelSelect.value || DEFAULT_MODEL;
    if (!state.connected) {
      addMessage('Ollama is offline. Please start Ollama and refresh the page.', 'assistant', 'system');
      return;
    }

    state.abortController = new AbortController();
    state.streaming = true;
    showStreamingUI(true);

    var { contentDiv } = addMessage('', 'assistant', model);
    setThinking(contentDiv, model);

    var fullResponse = '';

    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: model, messages: [{ role: 'user', content: text }], stream: true }),
        signal: state.abortController.signal
      });

      if (!res.ok) {
        var errText = 'HTTP ' + res.status;
        try { var errData = await res.json(); errText = errData.error || errData.detail || errText; } catch (e) {}
        throw new Error(errText);
      }

      if (!res.body || !res.body.getReader) {
        throw new Error('Streaming not supported by this browser.');
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';

      while (true) {
        var result = await reader.read();
        if (result.done) break;
        buffer += decoder.decode(result.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (!line) continue;
          try {
            var json = JSON.parse(line);
            if (json.message && json.message.content) {
              fullResponse += json.message.content;
              contentDiv.innerHTML = formatMessage(fullResponse);
              dom.messages.scrollTop = dom.messages.scrollHeight;
            }
          } catch (e) {}
        }
      }

      if (buffer.trim()) {
        try {
          var json = JSON.parse(buffer);
          if (json.message && json.message.content) {
            fullResponse += json.message.content;
            contentDiv.innerHTML = formatMessage(fullResponse);
          }
        } catch (e) {}
      }

      if (!fullResponse) {
        contentDiv.innerHTML = '<span style="color:#ef4444">No response from model. It may still be loading — try again in a moment.</span>';
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        contentDiv.innerHTML = '<span style="color:#ef4444">Generation stopped.</span>';
      } else {
        contentDiv.innerHTML = '<span style="color:#ef4444">Error: ' + escapeHtml(e.message) + '</span>';
      }
    } finally {
      state.streaming = false;
      state.abortController = null;
      showStreamingUI(false);
      handleInput();
    }
  }

  function handleInput() {
    if (!dom.input || !dom.sendBtn) return;
    var text = dom.input.value.trim();
    dom.sendBtn.disabled = !text || state.streaming;
    dom.input.style.height = 'auto';
    dom.input.style.height = Math.min(dom.input.scrollHeight, 180) + 'px';
  }

  function handleKeydown(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendMessage();
    } else if (e.key === 'Escape' && state.streaming) {
      if (state.abortController) state.abortController.abort();
    }
  }

  function newChat() {
    dom.messages.innerHTML = '';
    var welcome = document.createElement('div');
    welcome.id = 'welcome';
    welcome.className = 'welcome';
    welcome.innerHTML = '<img src="/logo-icon.png" alt="ForgeLLM" class="h-12 w-12 rounded-[8px] mb-4 opacity-80"/><h1 class="text-xl text-white/90">What can I help you build?</h1><p class="text-sm text-white/40 mt-2 mb-6">Powered by your own Ollama models.</p>' +
      '<div class="starter" data-starter="Explain the ForgeLLM architecture"><p class="text-white/70 text-sm">Explain the ForgeLLM architecture</p></div>' +
      '<div class="starter" data-starter="Write a React todo app"><p class="text-white/70 text-sm">Write a React todo app</p></div>' +
      '<div class="starter" data-starter="Debug my Python script"><p class="text-white/70 text-sm">Debug my Python script</p></div>';
    dom.messages.appendChild(welcome);
    bindStarters();
    dom.welcome = welcome;
  }

  function bindStarters() {
    document.querySelectorAll('.starter').forEach(s => {
      s.addEventListener('click', () => {
        dom.input.value = s.dataset.starter;
        handleInput();
        sendMessage();
      });
    });
  }

  function init() {
    loadModels();
    setInterval(loadModels, 30000);

    dom.sendBtn.addEventListener('click', sendMessage);
    dom.stopBtn.addEventListener('click', () => { if (state.abortController) state.abortController.abort(); });
    dom.input.addEventListener('input', handleInput);
    dom.input.addEventListener('keydown', handleKeydown);
    dom.newChatBtn.addEventListener('click', newChat);
    dom.modelSelect.addEventListener('change', updateSelectedModelStatus);
    bindStarters();

    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'n' || e.key === 'N')) {
        e.preventDefault();
        newChat();
      }
    });
  }

  init();
})();
</script>
</body>
</html>
